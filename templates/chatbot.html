{% extends "base.html" %}

{% block page_title %}AgriDrishti Assistant{% endblock %}

{% block content %}
<div class="dashboard-grid">
    <div class="glass-panel" style="grid-column: span 2; display: flex; flex-direction: column; height: 600px;">
        <div id="chat-box" style="flex: 1; overflow-y: auto; padding: 1rem; border: 1px solid var(--gray-light); border-radius: 8px; margin-bottom: 1rem; background: var(--white);">
            <div style="margin-bottom: 1rem; text-align: left;">
                <div style="display: inline-block; background: var(--persian-green-bg); color: var(--dark); padding: 0.75rem 1rem; border-radius: 12px; max-width: 70%;">
                    Hello! I am your AgriDrishti AI Assistant. Ask me anything about farming, weather, crops, or diseases!
                </div>
            </div>
        </div>
        
        <form id="chatForm" onsubmit="sendMessage(event)" style="display: flex; gap: 0.5rem;">
            <input type="text" id="chat-input" class="form-control" placeholder="Type your message here..." style="flex: 1; padding: 0.75rem; border-radius: 8px; border: 1px solid var(--gray-light);" required>
            <button type="submit" class="btn btn-primary" id="send-btn">Send</button>
        </form>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    async function sendMessage(e) {
        e.preventDefault();
        
        const input = document.getElementById('chat-input');
        const message = input.value.trim();
        if (!message) return;
        
        const chatBox = document.getElementById('chat-box');
        
        // Append user message
        chatBox.innerHTML += `
            <div style="margin-bottom: 1rem; text-align: right;">
                <div style="display: inline-block; background: var(--persian-green); color: var(--white); padding: 0.75rem 1rem; border-radius: 12px; max-width: 70%; text-align: left;">
                    ${message}
                </div>
            </div>
        `;
        
        input.value = '';
        chatBox.scrollTop = chatBox.scrollHeight;
        
        // Show typing indicator
        const typingId = 'typing-' + Date.now();
        chatBox.innerHTML += `
            <div id="${typingId}" style="margin-bottom: 1rem; text-align: left;">
                <div style="display: inline-block; background: var(--gray-light); color: var(--dark); padding: 0.75rem 1rem; border-radius: 12px; font-style: italic;">
                    AgriDrishti is thinking...
                </div>
            </div>
        `;
        chatBox.scrollTop = chatBox.scrollHeight;
        
        try {
            const response = await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: message })
            });
            const data = await response.json();
            
            // Remove typing indicator
            document.getElementById(typingId).remove();
            
            // Append bot message
            chatBox.innerHTML += `
                <div style="margin-bottom: 1rem; text-align: left;">
                    <div style="display: inline-block; background: var(--persian-green-bg); color: var(--dark); padding: 0.75rem 1rem; border-radius: 12px; max-width: 70%;">
                        ${data.reply}
                    </div>
                </div>
            `;
            chatBox.scrollTop = chatBox.scrollHeight;
            
        } catch (error) {
            document.getElementById(typingId).remove();
            chatBox.innerHTML += `
                <div style="margin-bottom: 1rem; text-align: left;">
                    <div style="display: inline-block; background: var(--danger); color: var(--white); padding: 0.75rem 1rem; border-radius: 12px;">
                        Error connecting to AI Assistant.
                    </div>
                </div>
            `;
        }
    }
</script>
{% endblock %}
