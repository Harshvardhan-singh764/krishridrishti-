<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Krishi Drishti</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        .login-box {
            width: 450px;
            text-align: center;
        }
        .form-group {
            margin-bottom: 1rem;
            text-align: left;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--persian-green-dark);
            font-weight: 500;
        }
        .form-control {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--gray-light);
            border-radius: 8px;
            font-size: 1rem;
        }
        .flash-messages {
            margin-bottom: 1rem;
            color: var(--danger);
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="glass-panel login-box">
        <h2 style="color: var(--persian-green); margin-bottom: 0.5rem;">Create an Account</h2>
        <p style="color: var(--gray); margin-bottom: 1.5rem;">Join Krishi Drishti to manage your farm smartly</p>
        
        {% with messages = get_flashed_messages() %}
          {% if messages %}
            <div class="flash-messages">
              {% for message in messages %}
                <div>{{ message }}</div>
              {% endfor %}
            </div>
          {% endif %}
        {% endwith %}
        
        <form action="/register" method="POST">
            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" class="form-control" placeholder="Choose a unique username" required>
            </div>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" name="email" class="form-control" placeholder="Enter your email" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" class="form-control" placeholder="Create a strong password" required>
            </div>
            
            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Register Account</button>
        </form>
        
        <div style="margin-top: 1.5rem; font-size: 0.9rem;">
            Already have an account? <a href="/" style="color: var(--persian-green); font-weight: 600; text-decoration: none;">Login here</a>
        </div>
    </div>
</body>
</html>
