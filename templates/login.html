<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Krishi Drishti</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        .login-box {
            width: 400px;
            text-align: center;
        }
        .form-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--persian-green-dark);
            font-weight: 500;
        }
        .form-control {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--gray-light);
            border-radius: 8px;
            font-size: 1rem;
        }
        .form-control:focus {
            outline: none;
            border-color: var(--persian-green);
            box-shadow: 0 0 0 3px rgba(27, 77, 62, 0.1);
        }
        .flash-messages {
            margin-bottom: 1rem;
            color: var(--danger);
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="glass-panel login-box">
        <h1 style="color: var(--persian-green); margin-bottom: 1rem;">🌱 Krishi Drishti</h1>
        <p style="color: var(--gray); margin-bottom: 2rem;">Sign in to your farm dashboard</p>
        
        {% with messages = get_flashed_messages() %}
          {% if messages %}
            <div class="flash-messages">
              {% for message in messages %}
                <div>{{ message }}</div>
              {% endfor %}
            </div>
          {% endif %}
        {% endwith %}
        
        <form action="/login" method="POST">
            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" class="form-control" placeholder="Enter username" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" class="form-control" placeholder="Enter password" required>
            </div>
            
            <div style="text-align: right; margin-bottom: 1rem;">
                <a href="/forgot_password" style="color: var(--persian-green); text-decoration: none; font-size: 0.9rem;">Forgot Password?</a>
            </div>
            
            <button type="submit" class="btn btn-primary" style="width: 100%;">Login to Dashboard</button>
        </form>
        
        <div style="margin-top: 1.5rem; font-size: 0.9rem;">
            Don't have an account? <a href="/register" style="color: var(--persian-green); font-weight: 600; text-decoration: none;">Create one here</a>
        </div>
    </div>
</body>
</html>
