<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Krishi Drishti</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        .login-box {
            width: 400px;
            text-align: center;
        }
        .form-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--persian-green-dark);
            font-weight: 500;
        }
        .form-control {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--gray-light);
            border-radius: 8px;
            font-size: 1rem;
        }
    </style>
</head>
<body>
    <div class="glass-panel login-box">
        <h2 style="color: var(--persian-green); margin-bottom: 0.5rem;">Reset Password</h2>
        <p style="color: var(--gray); margin-bottom: 1.5rem;">Enter your registered email address to receive a password reset link.</p>
        
        <form action="/forgot_password" method="POST">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" name="email" class="form-control" placeholder="Enter your email" required>
            </div>
            
            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem; background: var(--warning);">Send Reset Link</button>
        </form>
        
        <div style="margin-top: 1.5rem; font-size: 0.9rem;">
            Remembered your password? <a href="/" style="color: var(--persian-green); font-weight: 600; text-decoration: none;">Back to Login</a>
        </div>
    </div>
</body>
</html>
